<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="THE BABE DOLL monogram - black & gold">
  <style>
    .mono-white{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#0B0B0B}
    .brand{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#C9A66B;letter-spacing:3}
  </style>
  <rect width="100%" height="100%" fill="none"/>
  <!-- Gold circle with black letters (transparent background) -->
  <circle cx="70" cy="110" r="60" fill="#C9A66B"/>
  <text x="40" y="132" class="mono-white" font-size="48">TB</text>
  <!-- Wordmark -->
  <text x="160" y="132" class="brand" font-size="48">THE BABE DOLL</text>
</svg>
