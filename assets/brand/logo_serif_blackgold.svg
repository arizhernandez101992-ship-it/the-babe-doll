  <style>
    .serif{font-family:Georgia, 'Times New Roman', serif; font-weight:700; fill:#C9A66B}
    .light{font-family:Inter,Arial,sans-serif; fill:#F8F5F0; font-size:16px}
  </style>
  <rect width="100%" height="100%" fill="none"/>
  <text x="0" y="120" class="serif" font-size="72" letter-spacing="2">THE</text>
