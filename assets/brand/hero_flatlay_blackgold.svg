<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Hero flatlay - black & gold">
  <style>
    .bg{fill:#ffffff}.muted{fill:#8b8b8b;font-family:Inter,Arial;font-size:15px}.title{fill:#0B0B0B;font-family:Inter,Arial;font-weight:600;font-size:36px}
    .btn{fill:#C9A66B}.btn-text{fill:#0B0B0B}
