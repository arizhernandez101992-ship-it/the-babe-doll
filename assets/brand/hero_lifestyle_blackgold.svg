<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Hero lifestyle - black & gold">
  <style>
    .bg{fill:#ffffff}.muted{fill:#8b8b8b;font-family:Inter,Arial;font-size:16px}.title{fill:#0B0B0B;font-family:Inter,Arial;font-weight:600;font-size:40px}
    .btn{fill:#0B0B0B}.btn-text{fill:#fff;font-family:Inter,Arial;font-weight:700}
    .accent{fill:#C9A66B}
  </style>
  <rect width="100%" height="100%" class="bg"/>
  <rect x="640" y="40" width="520" height="400" rx="12" fill="#f3f4f6"/>
  <text x="700" y="250" class="muted">[Lifestyle photo placeholder]</text>
  <text x="64" y="140" class="title">Menos ruido. Mejores elecciones.</text>
  <text x="64" y="180" class="muted">Productos seleccionados para simplificar tu rutina.</text>
  <rect x="64" y="220" width="180" height="48" rx="10" class="btn"/>
  <text x="96" y="252" class="btn-text">Comprar ahora</text>
  <rect x="260" y="220" width="120" height="44" rx="10" fill="#C9A66B"/>
  <text x="292" y="252" fill="#0B0B0B" font-family="Inter,Arial" font-weight="700">Novedades</text>
</svg>
